name: Build CloudPlayX APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      # Same secret names as the optional signing inputs in app/build.gradle.kts
      HAVE_KEYSTORE_SECRET: ${{ secrets.CPX_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Guards against the "old copy got built" problem: build exactly this commit, from exactly one project.
      - name: Verify the project layout and source revision
        run: |
          echo "Building commit: $GITHUB_SHA"
          n=$(find . -name settings.gradle.kts -not -path './.git/*' | wc -l)
          if [ "$n" -ne 1 ]; then
            echo "::error::Expected exactly one Gradle project at the repository root, found $n:"
            find . -name settings.gradle.kts -not -path './.git/*'
            echo "Upload the CONTENTS of the CloudPlayXMobile folder to the repository root (not the folder itself)."
            exit 1
          fi
          test -f ./settings.gradle.kts || { echo "::error::settings.gradle.kts must be at the repository root"; exit 1; }
          if git ls-files | grep -Ei '\.(zip|bak)$'; then
            echo "::error::Archives/backup files are committed (listed above). Remove them so a stale copy can never be built."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # Google's Android OAuth client is bound to the SHA-1 of the signing key. A new runner creates a new random
      # debug key on every build, which makes Google Drive sign-in fail after every rebuild. So a fixed key is used:
      #  1) preferred: your own keystore from the repository secrets (see README "Stable signing key")
      #  2) fallback: a key generated once and kept in the Actions cache (may be evicted after ~7 idle days)
      - name: Use the signing key from repository secrets
        if: env.HAVE_KEYSTORE_SECRET == 'true'
        env:
          KS_B64: ${{ secrets.CPX_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cpx.jks"
          echo "CPX_KEYSTORE=$RUNNER_TEMP/cpx.jks" >> "$GITHUB_ENV"
          echo "CPX_KEYSTORE_PASSWORD=${{ secrets.CPX_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "CPX_KEY_ALIAS=${{ secrets.CPX_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "CPX_KEY_PASSWORD=${{ secrets.CPX_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Restore cached fallback debug key
        if: env.HAVE_KEYSTORE_SECRET != 'true'
        uses: actions/cache@v4
        with:
          path: ~/cpx-fallback-debug.jks
          key: cpx-fallback-debug-key-v1

      - name: Create fallback debug key if needed
        if: env.HAVE_KEYSTORE_SECRET != 'true'
        run: |
          if [ ! -f ~/cpx-fallback-debug.jks ]; then
            keytool -genkeypair -keystore ~/cpx-fallback-debug.jks -storepass android -keypass android \
              -alias cpxdebug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CloudPlayX Debug"
            echo "Generated a NEW fallback debug key: the signing SHA-1 changed." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "CPX_KEYSTORE=$HOME/cpx-fallback-debug.jks" >> "$GITHUB_ENV"
          echo "CPX_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "CPX_KEY_ALIAS=cpxdebug" >> "$GITHUB_ENV"
          echo "CPX_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: .github/ci-run.sh ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: .github/ci-run.sh ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: .github/ci-run.sh ./gradlew --no-daemon assembleDebug

      - name: Verify the APK and print its signing SHA-1
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::APK was not produced"; exit 1; }
          ls -l "$APK"
          CERTS=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          {
            echo "### CloudPlayX debug APK"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Size: $(du -h "$APK" | cut -f1)"
            echo "- Package name for Google OAuth: \`app.cloudplayx.mobile\`"
            echo "- Signing certificate (register this SHA-1 in Google Cloud Console):"
            echo '```'
            echo "$CERTS" | grep -i "SHA-1"
            echo '```'
            if [ "$HAVE_KEYSTORE_SECRET" != "true" ]; then
              echo "> Using the cached fallback key. Add the CPX_KEYSTORE_* secrets for a permanent SHA-1."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlayXMobile-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
