name: Build CloudPlayX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          if [ -f CloudPlayXMobile-Project.zip ]; then
            unzip -q CloudPlayXMobile-Project.zip -d extracted
          elif [ -f CloudPlayXMobile-FULL-UPDATED.zip ]; then
            unzip -q CloudPlayXMobile-FULL-UPDATED.zip -d extracted
          else
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install "platform-tools"
          "$SDKMANAGER" --install "platforms;android-34"
          "$SDKMANAGER" --install "build-tools;34.0.0"

      - name: Set up Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"
          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "gradlew missing; using downloaded Gradle."
            gradle --no-daemon assembleDebug
          fi

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but no debug APK was found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK created: $APK"

      - name: Print debug certificate SHA-1
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          else
            echo "Debug keystore not found."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlayXMobile-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
