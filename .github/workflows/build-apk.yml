name: Build CloudPlayX APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          mkdir -p extracted

          if [ -f "CloudPlayXMobile-Project.zip" ]; then
            unzip -q "CloudPlayXMobile-Project.zip" -d extracted
          elif [ -f "CloudPlayXMobile-FULL-UPDATED.zip" ]; then
            unzip -q "CloudPlayXMobile-FULL-UPDATED.zip" -d extracted
          else
            echo "ERROR: Project ZIP not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE/extracted" \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            echo "Files inside ZIP:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Existing Gradle Wrapper found."
          else
            echo "gradlew missing; checking installed Gradle."

            if command -v gradle >/dev/null 2>&1; then
              gradle wrapper
            else
              echo "ERROR: gradlew is missing and system Gradle is unavailable."
              echo "The project ZIP must include gradlew and gradle/wrapper files,"
              echo "or provide a valid Gradle installation/version."
              exit 1
            fi
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ERROR: Gradle wrapper properties are missing."
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Print debug certificate SHA-1
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"

          if [ -f "$KEYSTORE" ]; then
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey | grep -E 'SHA1:|SHA-1:'
          else
            echo "Debug keystore not found."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudPlayXMobile-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
